# =============================================================================
# FONTES MONITORADAS — Radar da Educação Superior (HUB de Integração / CINEA)
# =============================================================================
# Para acrescentar uma instituição, copie um bloco [[google_news]] e ajuste.
# Para desativar temporariamente, mude "ativo = true" para "ativo = false".
#
# Dois tipos de fonte:
#   [[google_news]] -> RSS do Google Notícias filtrado por site. Funciona para
#                      todas as instituições, inclusive portais gov.br que
#                      bloqueiam robôs.
#   [[dou]]         -> busca no Diário Oficial da União (in.gov.br). É a fonte
#                      primária de portarias, resoluções, pareceres e editais.
#                      secao: "do1" (atos normativos), "do2", "do3" ou "todos".
#                      periodo: "dia", "semana", "mes" ou "ano".
# =============================================================================

[geral]
# Itens mais antigos que isso saem do painel...
dias_retencao = 180
# ...exceto os publicados a partir desta data, que ficam sempre (pedido do Diego: histórico desde jan/2026).
# Para trazer de volta um período antigo: python -m radar --desde AAAA-MM-DD
manter_desde = "2026-01-01"
# Janela de busca no Google Notícias (ex.: "7d", "30d").
janela_google = "7d"

# ---------------------------------------------------------------- Nacionais --

[[google_news]]
