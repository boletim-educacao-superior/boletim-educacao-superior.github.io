# =============================================================================
# REGRAS DE TRIAGEM — Radar da Educação Superior
# =============================================================================
# A triagem é por palavras-chave (sem IA, sem custo). Os termos são comparados
# sem acento e sem diferenciar maiúsculas, no título + resumo de cada item
# (e no texto integral, para atos do DOU). Termos casam palavra inteira;
# termine com "*" para casar prefixo ("credenciad*" pega credenciado/a/os).
#
# Cada tema soma "peso" à pontuação. A pontuação define a prioridade:
#   urgente  -> gatilho de urgência atendido (ver [urgencia]); gera alerta
#   alta     -> pontuação >= limiar_alta
#   media    -> pontuação >= limiar_media
#   baixa    -> o restante
# =============================================================================

[prioridade]
limiar_alta = 6
limiar_media = 3

# ------------------------------------------------------------------ Temas --
# Perfil do CINEA (Centro de Inovação em Ensino e Aprendizagem), no NED
# (Núcleo de Educação Digital) da Prograd/PUC Minas: educação digital/EAD,
# regulação e avaliação de cursos, currículo e PPC, formação docente,
# tecnologias e dados educacionais, experiência discente.
#
# "setores" indica qual setor do CINEA deve olhar o item:
#   Hub          -> Hub de Integração e Relacionamento
#   Inovação     -> Inovação Pedagógica e Formação Continuada
#   Tecnologias  -> Tecnologias e Experiências de Aprendizagem
# Um item recebe os setores de todos os temas que encontrar.

