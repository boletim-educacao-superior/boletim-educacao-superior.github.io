]

# ------------------------------------------------- Atos de rotina --
# Atos individuais do dia a dia regulatório de OUTRAS instituições (autorizar
# curso X na faculdade Y, CEBAS etc.). Saem com prioridade baixa. Se o ato
# citar a PUC Minas, a regra de urgência abaixo continua valendo.

[rotina]
peso = 6
termos = [
  "fica autorizado o curso", "ficam autorizados os cursos", "autorizar o curso",
  "fica reconhecido o curso", "ficam reconhecidos", "reconhecer o curso",
  "renovar o reconhecimento", "fica renovado o reconhecimento", "ficam renovados",
  "fica(m) reconhecido*", "fica(m) autorizado*", "ficam indeferidos", "indeferir o pedido",
  "deferir o requerimento", "pedido de autorizacao", "autorizou o funcionamento",
  "fica credenciad*", "fica recredenciad*", "fica descredenciad*",
  "recredenciamento d*", "credenciamento de centro universitario", "recurso contra a decisao",
  "cebas", "entidade beneficente", "certificado de entidade beneficente",
  "homologado o parecer cne/ces", "conheceu do recurso", "negou-lhe provimento", "aditamento",
]

# --------------------------------------------------------- Urgência --
# Um item vira URGENTE (e dispara alerta) se atender QUALQUER regra abaixo.

[urgencia]
# 1) Ato do MEC/órgãos vinculados que cite a própria PUC Minas.
termos_instituicao = ["pontificia universidade catolica de minas gerais", "puc minas", "sociedade mineira de cultura"]
orgaos_oficiais = ["ministerio da educacao", "conselho nacional de educacao", "inep", "seres"]

# 2) Ato normativo (portaria, resolução...) que trate de EAD/educação digital.
tipos_normativos = ["Portaria", "Resolução", "Parecer", "Decreto / Lei"]
temas_urgentes = ["EAD e educação digital"]

# 3) Mudança estrutural, de qualquer fonte. Não vale para atos de rotina,
#    que costumam citar essas normas só na fundamentação, nem para eventos.
#    Inclui o que afeta cursos PRESENCIAIS apoiados pelo NED (carga horária
#    a distância, DCNs) e o que muda a preparação para avaliações do MEC.
termos_criticos = [
  "marco regulatorio", "novo marco", "diretrizes curriculares nacionais",
  "novo instrumento de avaliacao", "instrumentos de avaliacao", "regulamento do enade",
  "calendario do enade", "politica nacional de educacao a distancia",
  "carga horaria a distancia em cursos presenciais", "atividades a distancia em cursos presenciais",
  "limite de carga horaria a distancia", "curricularizacao da extensao",
]

# 4) Prazo/convocação em tema prioritário, vindo de órgão oficial.
temas_prioritarios = ["EAD e educação digital", "Regulação", "Avaliação de cursos", "Currículo e PPC"]
termos_prazo = [
  "prazo", "ultimo dia", "ultimos dias", "encerra", "prorroga", "cronograma",
  "convocacao", "obrigatorio", "obrigatoria",
]
instituicoes_oficiais = ["DOU", "MEC", "CNE", "INEP"]
